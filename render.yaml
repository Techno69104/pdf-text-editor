services:
  - type: web
    name: pdf-text-editor
    runtime: python
    repo: https://github.com/YOUR_USERNAME/pdf-text-editor  # Change this
    plan: free
    region: oregon  # or frankfurt, singapore, ohio
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
